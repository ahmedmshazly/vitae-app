name: CI

# FR-007: every job below fails loudly rather than skipping. The API suite needs
# Postgres, the calibration image must build with the correct Docker context, and
# production build plus Playwright are part of the gate.
#
# FR-016: actions are pinned to commit SHAs, not moving tags. A compromised or
# retagged action would otherwise execute in this pipeline with no diff in this
# repository.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22.23.0

jobs:
  dependency-review:
    name: Dependency review
    # The action calls the dependency-graph compare API. That API is free on a
    # public repo, but on a PRIVATE one it needs a GitHub Advanced Security /
    # Code Security licence, which is sold only through Enterprise. This repo
    # is private under a personal account, so the job cannot succeed on any
    # commit on any branch. Gating on visibility arms it the moment the repo
    # goes public and, unlike continue-on-error, never swallows a real finding.
    # `pnpm audit --audit-level=high` in `quality` covers this tree meanwhile.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: codebuild-vitae-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The action defaults to fail-on-severity: low. Match the floor
          # `pnpm audit --audit-level=high` already enforces, so the job
          # does not go red on day one over advisories the tree accepts.
          fail-on-severity: high

  quality:
    name: Typecheck · Lint · Unit · A11y · Security
    runs-on: codebuild-vitae-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Source↔test map, prose, public-data, and brand checks
        # test:map runs its own self-test first: the map gate silently passed
        # everything for months, so it must be seen to fail before it is trusted.
        run: pnpm test:map && pnpm test:prose && pnpm test:public && pnpm test:brand
      - name: Documentation registries, traceability and generated artifacts
        # docs:check runs its own self-tests first, for the same reason
        # test:map does: a gate is only trustworthy once seen to fail.
        run: pnpm docs:check
      # The suite's own ratchets, and the check that scripts/ci-local.sh still
      # mirrors this file. Both were prose until 2026-08-25, and both were
      # wrong while they were.
      - name: Harness gates (CI mirror, e2e ratchets)
        run: pnpm test:mirror && pnpm test:ratchets && pnpm test:workflow
      - name: Reject high and critical dependency vulnerabilities
        run: pnpm audit --audit-level=high
      - name: Unit + property-fuzz tests (packages/core + testkit)
        run: pnpm test:unit
      # The design system is the most depended-on package in the repository and
      # no job ran its 226 cases. docs/generated/tests.json counted them under
      # "workspaces CI never runs" for as long as that artifact has existed.
      - name: Design system tests (@vitae/ui)
        run: pnpm --filter @vitae/ui test
      - name: Property / metamorphic / golden corpus
        run: pnpm test:property
      - name: Web unit / component tests
        run: pnpm test:web
      - name: Web accessibility (axe) contracts
        run: pnpm test:a11y

  build:
    name: Production build
    runs-on: codebuild-vitae-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the SPA in CI so a broken import or bad env reference fails here.
      - run: pnpm build
      - name: Assert the SPA bundle exists
        run: test -f apps/web/dist/index.html
      - name: Web bundle size budgets
        run: VITAE_REQUIRE_BUDGETS=true pnpm test:performance
      - name: Reject mutable production base images
        # The pattern must reach ripgrep with single-backslash classes (\s, \S).
        # Double-escaping ('\\s') makes ripgrep treat a literal backslash-s, so
        # the guard matches nothing. The self-test below fails the job if the
        # pattern ever stops catching an unpinned reference.
        run: |
          # ripgrep ships on GitHub-hosted ubuntu-latest but not on the
          # CodeBuild standard image this job now runs on. Install it only when
          # missing (no-op on runners that already have it), tolerating both
          # root (no sudo) and non-root images.
          if ! command -v rg >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y ripgrep
            else
              apt-get update && apt-get install -y ripgrep
            fi
          fi
          PATTERN='^\s*(FROM|image:)\s+\S+$'
          EXCLUDE='@sha256:|image: vitae/'
          # Self-test: an intentionally unpinned reference MUST be caught.
          if ! printf 'FROM node:22-alpine\n' | rg "$PATTERN" | rg -v "$EXCLUDE" >/dev/null; then
            echo "::error::digest-pin guard is broken: it no longer flags an unpinned image"; exit 1
          fi
          if rg "$PATTERN" apps/api/Dockerfile services/buildsvc/Dockerfile deploy/compose.prod.yml \
            | rg -v "$EXCLUDE"; then
            echo "::error::Production image reference is not digest-pinned"; exit 1
          fi
      - name: Build production API image
        run: docker build -f apps/api/Dockerfile -t vitae/api:ci .
      - name: Scan API image for critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          --db-repository ghcr.io/aquasecurity/trivy-db:2
          vitae/api:ci
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: vitae-sbom.spdx.json

  api-integration:
    name: API integration (Postgres)
    runs-on: codebuild-vitae-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: vitae
          POSTGRES_PASSWORD: vitae
          POSTGRES_DB: vitae
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vitae -d vitae"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # vitest.global-setup.ts creates and migrates its own vitae_test database
      # from this, and refuses to start if Postgres is unreachable.
      DATABASE_URL: postgresql://vitae:vitae@127.0.0.1:5433/vitae
      FIREBASE_PROJECT_ID: vitae-ci
      GCLOUD_PROJECT: vitae-ci
      OWNER_EMAIL: owner@example.com
      SESSION_SECRET: ci-session-secret-not-a-real-one
      AUTH_ENABLE_DEV_LOGIN: 'true'
      BUILDSVC_HMAC_SECRET: ci-buildsvc-secret
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: OpenAPI + error-envelope contracts
        run: pnpm test:contract
      # These two live here rather than in `quality` because apps/api's vitest
      # config declares a globalSetup that creates and migrates its own
      # database, and vitest runs globalSetup before it resolves which files to
      # execute. Narrowing the invocation to two middleware unit tests does not
      # skip it, so in a job with no postgres service they died in setup having
      # run nothing at all.
      - name: Security unit contracts (auth + headers)
        run: pnpm test:security
      - name: Resilience unit (buildsvc offline / HMAC shape)
        run: pnpm test:resilience

      - name: Run API tests against Postgres
        # --passWithNoTests=false: a suite that skips itself must fail the build,
        # which is exactly how authentication and revision coverage went missing.
        # Includes contract suites again as part of the full API run.
        run: pnpm --filter @vitae/api test -- --passWithNoTests=false --reporter=verbose

  latex-calibration:
    name: LaTeX line-model calibration
    runs-on: codebuild-vitae-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # FR-007: the Dockerfile needs the REPO ROOT as context (it bakes in
      # templates/), so `docker build … services/buildsvc` could never work.
      - name: Build the Tectonic build service image
        run: docker build -f services/buildsvc/Dockerfile -t vitae/buildsvc:ci .
      - name: Scan build service image for critical vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e
          image --exit-code 1 --ignore-unfixed --severity CRITICAL
          --db-repository ghcr.io/aquasecurity/trivy-db:2
          vitae/buildsvc:ci
      - name: Compile calibration fixtures (guards FR-RES-009 line-model drift)
        run: >-
          docker run --rm --network none --tmpfs /tmp
          -e WARMED_MANIFEST_PATH=/tmp/warmed-manifest.json
          vitae/buildsvc:ci node dist/calibrate.js --only-cached

  e2e:
    name: E2E journeys (Playwright)
    runs-on: codebuild-vitae-ci-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: vitae
          POSTGRES_PASSWORD: vitae
          POSTGRES_DB: vitae
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U vitae -d vitae"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vitae:vitae@127.0.0.1:5433/vitae
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIREBASE_PROJECT_ID: vitae-ci
      GCLOUD_PROJECT: vitae-ci
      OWNER_EMAIL: owner@example.com
      SESSION_SECRET: ci-session-secret-not-a-real-one
      AUTH_ENABLE_DEV_LOGIN: 'true'
      BUILDSVC_HMAC_SECRET: ci-buildsvc-secret
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:4000/api/v1
      # The web build's half of the auth story. This job already starts the
      # Firebase Auth emulator, but nothing told the SPA about it, so
      # `googleSignInAvailable` was false and the sign-in page rendered without
      # its Google button — a page no developer has ever seen, because every
      # developer machine has these five lines from .env.example. Three specs
      # were failing on the difference. Values are the documented local ones;
      # `assertHostedConfiguration` in apps/web/vite.config.ts rejects exactly
      # these, but only under Vercel, so the production build job is unaffected.
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: vitae-local.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: vitae-local
      VITE_FIREBASE_USE_EMULATOR: 'true'
      VITE_FIREBASE_AUTH_EMULATOR_HOST: http://127.0.0.1:9099
      # The documentation corpus is served by the API from here, not by the web
      # host, so `docs.spec.ts` needs it built and pointed at. Without this the
      # API answers 503 and every documentation navigation in that spec fails
      # on a missing heading rather than on anything it is testing.
      DOCS_CONTENT_DIR: docs/.compiled
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vitae/e2e exec playwright install --with-deps chromium

      - name: Start the Firebase Auth emulator
        run: pnpm exec firebase emulators:start --only auth --project vitae-ci &

      - name: Apply schema and seed both spaces
        run: |
          pnpm --filter @vitae/api migrate
          pnpm --filter @vitae/api seed
          # Both: several journeys read demo data, and the résumé journeys need
          # the parsed-JD targets that only the demo seed creates.
          pnpm --filter @vitae/api seed:demo

      - name: Start the isolated LaTeX build service
        run: |
          docker build -f services/buildsvc/Dockerfile -t vitae/buildsvc:e2e .
          docker run -d --name vitae-buildsvc-e2e --network host --tmpfs /tmp \
            -e NODE_ENV=test \
            -e BUILDSVC_HOST=127.0.0.1 \
            -e BUILDSVC_HMAC_SECRET="${BUILDSVC_HMAC_SECRET}" \
            vitae/buildsvc:e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs vitae-buildsvc-e2e
          echo "::error::Build service did not become ready within 30s"; exit 1

      # Before the API starts, because the API reads this directory on the first
      # request and a missing manifest is reported as "no corpus published".
      - name: Compile the documentation corpus
        run: pnpm docs:build

      - name: Start API and web
        run: |
          pnpm --filter @vitae/web build
          pnpm --filter @vitae/api start > api.log 2>&1 &
          pnpm --filter @vitae/web exec vite preview --host 127.0.0.1 --port 5173 > web.log 2>&1 &

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/ready >/dev/null 2>&1 \
               && curl -sf http://localhost:5173 >/dev/null 2>&1; then
              echo "services ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API/web did not become ready within 60s"; exit 1

      - name: Run journeys (J1 capture · J4 résumé · J8 trash/restore)
        run: pnpm --filter @vitae/e2e test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            api.log
            web.log
          retention-days: 7
