# Vitae backend on a single cheap VM (the "cheapest path" topology in
# docs/DEPLOYMENT.md). Three containers:
#
#   caddy    - public :80/:443, automatic HTTPS, reverse-proxies to the API
#   api      - Express API (apps/api), private network only
#   buildsvc - LaTeX compiler, private network only, reachable as buildsvc:8787
#
# Usage (from the repo root on the VM):
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/compose.prod.yml up -d --build
#
# The web SPA is NOT here; it deploys to Vercel (docs/DEPLOYMENT.md §3).

name: vitae

services:
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      - API_DOMAIN=${API_DOMAIN:?set API_DOMAIN in deploy/.env, e.g. api.vitae.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: vitae/api:prod
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - BUILDSVC_URL=http://buildsvc:8787
      - DOCS_CONTENT_DIR=/app/docs-content
      # Multi-tenant mode: any verified Google sign-in is admitted and gets its
      # own workspace, rather than the single OWNER_EMAIL allow-list. Set here
      # rather than in the host's .env because it changes what this deployment
      # *is*, and that belongs somewhere reviewable.
      #
      # OWNER_EMAIL keeps two jobs under this flag: it claims the pre-Cloud
      # graph on first bootstrap, and it is still the only identity the
      # documentation corpus is served to — see apps/api/src/routes/v1/docs.ts.
      #
      # Billing is a separate matter. Without the Paddle server credentials in
      # .env a new workspace trials and then goes read-only with no way to pay.
      - VITAE_CLOUD_ENABLED=true
    volumes:
      # The compiled documentation corpus. Served by the API rather than by the
      # web host because it is private: it describes every trust boundary in
      # the system and enumerates every route, endpoint, table and exported
      # symbol in the repository, so published openly it is a map of the
      # software for anyone who wants one. Behind the API it inherits the
      # OWNER_EMAIL allow-list that gates every other request.
      #
      # Mounted rather than baked in, for the same reason as the CA bundle
      # below: republishing the documentation is then a file copy instead of an
      # image rebuild. Build it on a machine with the repository checked out —
      # the compiler reads the tracked file set with git, which no build
      # context has — and copy the result here:
      #   pnpm docs:build && rsync -a docs/.compiled/ <host>:deploy/docs-content/
      #
      # Read-only: nothing should ever write to it. If the directory is absent
      # the API answers /api/v1/docs with 503 and says so, rather than
      # reporting an empty corpus.
      - ./docs-content:/app/docs-content:ro
      # RDS presents a certificate signed by an Amazon CA that Node does not
      # trust by default. Mounted rather than baked into the image so rotating
      # it is a file copy, not a rebuild, and read-only because nothing should
      # ever write to a trust store.
      #   curl -o deploy/rds-ca.pem \
      #     https://truststore.pki.rds.amazonaws.com/eu-central-1/eu-central-1-bundle.pem
      - ./rds-ca.pem:/app/deploy/rds-ca.pem:ro
    networks: [edge, internal]
    depends_on:
      buildsvc:
        condition: service_healthy

  buildsvc:
    build:
      # Repo root: the image bakes in templates/ and warms + offline-verifies
      # the Tectonic cache against the real templates at build time.
      context: ..
      dockerfile: services/buildsvc/Dockerfile
    image: vitae/buildsvc:prod
    restart: unless-stopped
    # Docker sends SIGTERM then kills after 10s by default, which would end a
    # compile mid-run and make the service's 90s drain (services/buildsvc/src/server.ts:290)
    # a promise it is never given the time to keep.
    stop_grace_period: 100s
    environment:
      - PORT=8787
      - BUILDSVC_HOST=0.0.0.0
      - BUILDSVC_HMAC_SECRET=${BUILDSVC_HMAC_SECRET:?set BUILDSVC_HMAC_SECRET in deploy/.env}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8787/healthz']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Hardening (SRS T3): no new privileges, read-only root, writable /tmp only.
    # The warmed Tectonic cache is baked into the image; the entrypoint copies
    # it onto tmpfs at startup (Tectonic needs a writable cache), so rebuilds
    # can never be shadowed by a stale volume. That staleness plus the sealed
    # internal network is exactly how the phvr8t/DNS compile failure happened.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks: [internal]

networks:
  edge: {}
  # internal is not exposed through caddy; buildsvc is API-only.
  internal:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
